name: build-and-sign

# Builds the Windows client on a GitHub-hosted runner, tests it and attests the archive's provenance.
# Publishing a GitHub Release (tag v*, created on the Releases page) runs it and attaches the archive and
# its SHA-256 to that release. A bare tag push does not build: publishing the release already creates the
# tag, and a second run would race the first one for the same release and the update channel.
#
# A published (not pre-) release also becomes the update channel: latest.json and the archive go to the
# "updates" branch, which installed clients read through raw.githubusercontent.com (UpdateFeed.cs).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  actions: read
  contents: write      # release assets and the updates branch
  id-token: write      # artifact attestations
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    env:
      ENGINE_APP_URL: https://raw.githubusercontent.com/divezh/netlane-updates/main/v0.5.4/Netlane-windows-x64.zip
      ENGINE_APP_SHA256: c022c6144010a476e471948a1ead9df2608b26913cc4a22824f9f3ee22706adb

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Tag matches the client version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # A tag that differs from Program.Version would offer the same update again after every install.
          $match = Select-String -Path clients/windows/Program.cs -Pattern 'internal const string Version = "([^"]+)"'
          $version = $match.Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match Program.Version $version" }

      - name: Fetch the patched engine from the pinned public release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -UseBasicParsing -Uri $env:ENGINE_APP_URL -OutFile engine-app.zip
          $actual = (Get-FileHash engine-app.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:ENGINE_APP_SHA256) { throw "Engine archive hash mismatch: $actual" }
          Expand-Archive engine-app.zip -DestinationPath engine-app
          $target = 'research/windows-client/cmake-build-msvc-relwithdebinfo/trusttunnel/trusttunnel_client.exe'
          New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
          Copy-Item engine-app/engine/trusttunnel_client.exe $target -Force

      - name: Build client
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File clients/windows/build.ps1 -DownloadEngine -NoTest

      - name: Test client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & artifacts/windows/Netlane/NetlaneTests.exe
          if ($LASTEXITCODE -ne 0) { throw "Tests failed: $LASTEXITCODE" }

      - name: Final archive and SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          $zip = 'dist/Netlane-windows-x64.zip'
          Copy-Item artifacts/Netlane-windows-x64.zip $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Netlane-windows-x64.zip" | Set-Content "$zip.sha256" -Encoding ASCII
          Write-Host "Archive SHA-256: $hash"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/Netlane-windows-x64.zip

      - name: Upload archive
        uses: actions/upload-artifact@v5
        with:
          name: Netlane-windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          # Release notes: the CHANGELOG section of this version.
          $lines = Get-Content CHANGELOG.md -Encoding UTF8
          $start = [Array]::FindIndex($lines, [Predicate[string]]{ param($l) $l -like "## $version*" })
          $notes = if ($start -ge 0) {
            $end = [Array]::FindIndex($lines, $start + 1, [Predicate[string]]{ param($l) $l -like '## *' })
            if ($end -lt 0) { $end = $lines.Length }
            ($lines[($start + 1)..($end - 1)] -join "`n").Trim()
          } else { "Netlane $version" }
          $notes += "`n`nПроверка происхождения архива: ``gh attestation verify Netlane-windows-x64.zip --repo $env:GITHUB_REPOSITORY``"
          Set-Content release-notes.md $notes -Encoding UTF8
          $assets = @('dist/Netlane-windows-x64.zip', 'dist/Netlane-windows-x64.zip.sha256')
          gh release upload $tag @assets --clobber
          gh release edit $tag --title "Netlane $version" --notes-file release-notes.md

      - name: Publish to the update channel
        if: startsWith(github.ref, 'refs/tags/v') && !github.event.release.prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          $prerelease = gh release view $tag --json isPrerelease --jq .isPrerelease
          if ($prerelease -eq 'true') { Write-Host 'Pre-release: the update channel is left as it is.'; exit 0 }
          # The dialog shows one short line: the first points of this version's CHANGELOG section.
          $lines = Get-Content CHANGELOG.md -Encoding UTF8
          $start = [Array]::FindIndex($lines, [Predicate[string]]{ param($l) $l -like "## $version*" })
          $points = @()
          if ($start -ge 0) {
            for ($i = $start + 1; $i -lt $lines.Length -and -not $lines[$i].StartsWith('## '); $i++) {
              if ($lines[$i] -match '^\s*[-*]\s+(.+)$') { $points += ($Matches[1] -replace '[`*]', '').Trim() }
            }
          }
          $notes = ($points -join ' ').Trim()
          if ($notes.Length -gt 240) { $notes = $notes.Substring(0, 240).TrimEnd() + '…' }
          if (-not $notes) { $notes = "Netlane $version" }
          $hash = (Get-FileHash dist/Netlane-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $repo = $env:GITHUB_REPOSITORY
          $manifest = [ordered]@{
            version = $version
            url     = "https://raw.githubusercontent.com/$repo/updates/v$version/Netlane-windows-x64.zip"
            mirror  = "https://github.com/$repo/releases/download/$tag/Netlane-windows-x64.zip"
            sha256  = $hash
            notes   = $notes
          }
          # The branch keeps one commit with the current version only, so old archives do not pile up.
          $channel = Join-Path $env:RUNNER_TEMP channel
          New-Item -ItemType Directory -Force (Join-Path $channel "v$version") | Out-Null
          Copy-Item dist/Netlane-windows-x64.zip, dist/Netlane-windows-x64.zip.sha256 (Join-Path $channel "v$version")
          $json = $manifest | ConvertTo-Json
          [IO.File]::WriteAllText((Join-Path $channel 'latest.json'), $json + "`n", (New-Object Text.UTF8Encoding $false))
          Push-Location $channel
          git init -q -b updates
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Канал обновлений: $version"
          git push --force "https://x-access-token:$env:GH_TOKEN@github.com/$repo.git" updates
          Pop-Location
          Write-Host $json
