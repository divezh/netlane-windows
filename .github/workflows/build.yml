name: build

# Builds the Windows client on a GitHub-hosted runner, tests it and attests the archive's provenance.
# Publishing a GitHub Release (tag v*, created on the Releases page) runs it and attaches the archive and
# its SHA-256 to that release. Installed clients update from the latest release (UpdateFeed.cs), so the
# release itself is the update channel. A bare tag push does not build.

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  actions: read
  contents: write      # release assets
  id-token: write      # artifact attestations
  attestations: write

jobs:
  # The routed engine: TrustTunnel Client 1.1.11 built from source with clients/windows/upstream/*.patch.
  # Cached by the patches and the build script, so it is rebuilt only when they change.
  engine:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cached engine
        id: cache
        uses: actions/cache@v4
        with:
          path: engine-out
          key: engine-windows-${{ hashFiles('clients/windows/upstream/*.patch', 'clients/windows/build-engine-ci.ps1') }}

      - name: Conan cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-windows-${{ hashFiles('clients/windows/upstream/*.patch') }}
          restore-keys: conan-windows-

      - name: Tools
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          choco install nasm ninja -y --no-progress
          "C:\Program Files\NASM" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Visual Studio developer shell
        if: steps.cache.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build and test the engine
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Strawberry Perl's GCC must not be picked up instead of MSVC.
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notlike '*Strawberry\c\bin*' }) -join ';'
          ./clients/windows/build-engine-ci.ps1
          New-Item -ItemType Directory -Force engine-out | Out-Null
          Copy-Item research/windows-client/cmake-build-msvc-relwithdebinfo/trusttunnel/trusttunnel_client.exe engine-out/ -Force

      - name: Upload engine
        uses: actions/upload-artifact@v5
        with:
          name: engine-windows
          path: engine-out
          if-no-files-found: error

  build:
    needs: engine
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Tag matches the client version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # A tag that differs from Program.Version would offer the same update again after every install.
          $match = Select-String -Path clients/windows/Program.cs -Pattern 'internal const string Version = "([^"]+)"'
          $version = $match.Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match Program.Version $version" }

      - name: Download engine
        uses: actions/download-artifact@v5
        with:
          name: engine-windows
          path: research/windows-client/cmake-build-msvc-relwithdebinfo/trusttunnel

      - name: Build client
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File clients/windows/build.ps1 -DownloadEngine -NoTest

      - name: Test client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & artifacts/windows/Netlane/NetlaneTests.exe
          if ($LASTEXITCODE -ne 0) { throw "Tests failed: $LASTEXITCODE" }

      - name: Screenshots for guides
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force screenshots | Out-Null
          $exe = Resolve-Path artifacts/windows/Netlane/Netlane.exe
          foreach ($shot in @(@('no-servers', '--page=no-servers'), @('import', '--page=import'), @('connected', '--state=connected'))) {
            $out = Join-Path (Resolve-Path screenshots) ($shot[0] + '.png')
            $p = Start-Process -FilePath $exe -ArgumentList @('--render', $out, $shot[1]) -Wait -PassThru
            if ($p.ExitCode -ne 0 -or -not (Test-Path $out)) { Write-Warning "screenshot $($shot[0]) failed: $($p.ExitCode)" }
          }

      - name: Upload screenshots
        uses: actions/upload-artifact@v5
        with:
          name: screenshots-windows
          path: screenshots/*.png
          if-no-files-found: warn

      - name: Final archive and SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          $zip = 'dist/Netlane-windows-x64.zip'
          Copy-Item artifacts/Netlane-windows-x64.zip $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Netlane-windows-x64.zip" | Set-Content "$zip.sha256" -Encoding ASCII
          Write-Host "Archive SHA-256: $hash"

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/Netlane-windows-x64.zip

      - name: Upload archive
        uses: actions/upload-artifact@v5
        with:
          name: Netlane-windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          # Release notes: the CHANGELOG section of this version.
          $lines = Get-Content CHANGELOG.md -Encoding UTF8
          $start = [Array]::FindIndex($lines, [Predicate[string]]{ param($l) $l -like "## $version*" })
          $notes = if ($start -ge 0) {
            $end = [Array]::FindIndex($lines, $start + 1, [Predicate[string]]{ param($l) $l -like '## *' })
            if ($end -lt 0) { $end = $lines.Length }
            ($lines[($start + 1)..($end - 1)] -join "`n").Trim()
          } else { "Netlane $version" }
          $notes += "`n`nПроверка происхождения архива: ``gh attestation verify Netlane-windows-x64.zip --repo $env:GITHUB_REPOSITORY``"
          Set-Content release-notes.md $notes -Encoding UTF8
          $assets = @('dist/Netlane-windows-x64.zip', 'dist/Netlane-windows-x64.zip.sha256')
          gh release upload $tag @assets --clobber
          gh release edit $tag --title "Netlane $version" --notes-file release-notes.md
