name: build

# Builds the Windows client on a GitHub-hosted runner, tests it and attests the archive's provenance.
# Pushing a tag vX.Y.Z builds it and creates a DRAFT release with the archive and its SHA-256. Installed
# clients take only a published release whose archive carries the owner's signature (.sig, made off
# GitHub with the release key), so the owner signs the archive and then publishes the draft
# (docs: netlane-server/docs/SIGNING.md).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag vX.Y.Z to draft from this commit (the tag is created when the draft is published)
        required: false
        default: ''

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  # The routed engine: TrustTunnel Client 1.1.12 built from source with clients/windows/upstream/*.patch.
  # Cached by the patches and the build script, so it is rebuilt only when they change.
  engine:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Cached engine
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: engine-out
          key: engine-windows-${{ hashFiles('clients/windows/upstream/*.patch', 'clients/windows/build-engine-ci.ps1') }}

      - name: Conan cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.conan2
          key: conan-windows-${{ hashFiles('clients/windows/upstream/*.patch') }}
          restore-keys: conan-windows-

      - name: Tools
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          choco install nasm ninja -y --no-progress
          "C:\Program Files\NASM" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Visual Studio developer shell
        if: steps.cache.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Build and test the engine
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Strawberry Perl's GCC must not be picked up instead of MSVC.
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notlike '*Strawberry\c\bin*' }) -join ';'
          ./clients/windows/build-engine-ci.ps1
          New-Item -ItemType Directory -Force engine-out | Out-Null
          Copy-Item research/windows-client/cmake-build-msvc-relwithdebinfo/trusttunnel/trusttunnel_client.exe engine-out/ -Force

      - name: Upload engine
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: engine-windows
          path: engine-out
          if-no-files-found: error

  build:
    needs: engine
    runs-on: windows-latest
    permissions:
      contents: write      # the draft release
      id-token: write      # artifact attestations
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Tag matches the client version
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          # A tag that differs from Program.Version would offer the same update again after every install.
          $match = Select-String -Path clients/windows/Program.cs -Pattern 'internal const string Version = "([^"]+)"'
          $version = $match.Matches[0].Groups[1].Value
          if ("v$version" -ne $env:RELEASE_TAG) { throw "Tag $env:RELEASE_TAG does not match Program.Version $version" }

      - name: Download engine
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: engine-windows
          path: research/windows-client/cmake-build-msvc-relwithdebinfo/trusttunnel

      - name: Build client
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File clients/windows/build.ps1 -DownloadEngine -NoTest

      - name: Test client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & artifacts/windows/Netlane/NetlaneTests.exe
          if ($LASTEXITCODE -ne 0) { throw "Tests failed: $LASTEXITCODE" }

      - name: Screenshots for guides
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force screenshots | Out-Null
          $exe = Resolve-Path artifacts/windows/Netlane/Netlane.exe
          foreach ($shot in @(@('no-servers', '--page=no-servers'), @('import', '--page=import'), @('connected', '--state=connected'))) {
            $out = Join-Path (Resolve-Path screenshots) ($shot[0] + '.png')
            $p = Start-Process -FilePath $exe -ArgumentList @('--render', $out, $shot[1]) -Wait -PassThru
            if ($p.ExitCode -ne 0 -or -not (Test-Path $out)) { Write-Warning "screenshot $($shot[0]) failed: $($p.ExitCode)" }
          }

      - name: Upload screenshots
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: screenshots-windows
          path: screenshots/*.png
          if-no-files-found: warn

      - name: Final archive and SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          $zip = 'dist/Netlane-windows-x64.zip'
          Copy-Item artifacts/Netlane-windows-x64.zip $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Netlane-windows-x64.zip" | Set-Content "$zip.sha256" -Encoding ASCII
          Write-Host "Archive SHA-256: $hash"

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/Netlane-windows-x64.zip

      - name: Upload archive
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: Netlane-windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Draft release
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $version = $tag.TrimStart('v')
          # Release notes: the CHANGELOG section of this version.
          $lines = Get-Content CHANGELOG.md -Encoding UTF8
          $start = [Array]::FindIndex($lines, [Predicate[string]]{ param($l) $l -like "## $version*" })
          $notes = if ($start -ge 0) {
            $end = [Array]::FindIndex($lines, $start + 1, [Predicate[string]]{ param($l) $l -like '## *' })
            if ($end -lt 0) { $end = $lines.Length }
            ($lines[($start + 1)..($end - 1)] -join "`n").Trim()
          } else { "Netlane $version" }
          $notes += "`n`nПодпись владельца: ``openssl dgst -sha256 -verify netlane-release.pub -signature Netlane-windows-x64.zip.sig Netlane-windows-x64.zip``. Происхождение сборки: ``gh attestation verify Netlane-windows-x64.zip --repo $env:GITHUB_REPOSITORY``"
          Set-Content release-notes.md $notes -Encoding UTF8
          $assets = @('dist/Netlane-windows-x64.zip', 'dist/Netlane-windows-x64.zip.sha256')
          # A published release is immutable and already signed: never replace its archive.
          $existing = gh release view $tag --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($existing -ne 'true') { throw "$tag is already published" }
            gh release upload $tag @assets --clobber
            gh release edit $tag --title "Netlane $version" --notes-file release-notes.md
          } else {
            gh release create $tag @assets --draft --target $env:GITHUB_SHA --title "Netlane $version" --notes-file release-notes.md
          }
          Write-Host "::notice::Draft $tag is ready: sign Netlane-windows-x64.zip and publish"
