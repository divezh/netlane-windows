name: Publish signed release
# The owner signs the release files off GitHub with the release key (docs: netlane-server/docs/SIGNING.md)
# and pastes the signatures here. The workflow checks each signature against netlane-release.pub, attaches
# it to the draft and publishes the draft. A wrong signature stops everything: nothing is published.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft Windows release tag (vX.Y.Z)
        required: true
      signatures:
        description: 'Both ASSET=BASE64 signatures: Netlane-windows-x64.zip and Netlane-Setup-X.Y.Z-x64.exe'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      SIGNATURES: ${{ inputs.signatures }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Verify, attach and publish
        run: |
          set -euo pipefail
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad tag"; exit 1; }
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true || { echo "::error::$TAG is not a draft"; exit 1; }
          mkdir -p work
          setup="Netlane-Setup-${TAG#v}-x64.exe"
          declare -A provided
          for pair in $SIGNATURES; do
            name=${pair%%=*}; value=${pair#*=}
            [[ $name == Netlane-windows-x64.zip || $name == "$setup" ]] || { echo "::error::unexpected asset $name"; exit 1; }
            [[ -z ${provided[$name]:-} ]] || { echo "::error::duplicate signature $name"; exit 1; }
            provided[$name]=1
            printf '%s' "$value" | base64 -d > "work/$name.sig"
          done
          for name in Netlane-windows-x64.zip "$setup"; do
            [[ -n ${provided[$name]:-} ]] || { echo "::error::missing signature $name"; exit 1; }
            gh release download "$TAG" -p "$name" -p "$name.sha256" -D work --clobber
            (cd work && sha256sum -c "$name.sha256")
            openssl dgst -sha256 -verify netlane-release.pub -signature "work/$name.sig" "work/$name"
          done
          gh release upload "$TAG" work/*.sig --clobber
          gh release edit "$TAG" --draft=false --latest
          echo "::notice::$TAG published with the owner's signatures"
